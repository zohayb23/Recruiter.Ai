apiVersion: v1
kind: ServiceAccount
metadata:
  name: recruiter-ai-sa
  namespace: recruiter-ai
  annotations:
    iam.gke.io/gcp-service-account: recruiter-ai-gcp-sa@recruiter-ai-milvus.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recruiter-ai-role
  namespace: recruiter-ai
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["external-secrets.io"]
  resources: ["secretstores", "externalsecrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recruiter-ai-role-binding
  namespace: recruiter-ai
subjects:
- kind: ServiceAccount
  name: recruiter-ai-sa
  namespace: recruiter-ai
roleRef:
  kind: Role
  name: recruiter-ai-role
  apiGroup: rbac.authorization.k8s.io 