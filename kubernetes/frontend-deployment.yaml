apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiter-frontend
  namespace: recruiter-ai
  labels:
    app: recruiter-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruiter-frontend
  template:
    metadata:
      labels:
        app: recruiter-frontend
    spec:
      containers:
      - name: recruiter-frontend
        image: gcr.io/recruiter-ai/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recruiter-frontend
  namespace: recruiter-ai
  annotations:
    cloud.google.com/backend-config: '{"default": "recruiter-frontend-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: recruiter-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recruiter-frontend-ingress
  namespace: recruiter-ai
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "recruiter-frontend-ip"
    networking.gke.io/managed-certificates: "recruiter-frontend-cert"
    networking.gke.io/v1beta1.FrontendConfig: "recruiter-frontend-config"
spec:
  rules:
  - host: app.recruiter-ai.com  # Replace with your domain
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: recruiter-frontend
            port:
              number: 80 