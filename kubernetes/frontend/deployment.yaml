apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiter-frontend
  namespace: default
  labels:
    app: recruiter-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruiter-frontend
  template:
    metadata:
      labels:
        app: recruiter-frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/recruiter-ai-milvus/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recruiter-frontend-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: recruiter-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recruiter-frontend-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: recruiter.ai  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recruiter-frontend-service
            port:
              number: 80 