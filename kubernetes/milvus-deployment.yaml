apiVersion: v1
kind: Namespace
metadata:
  name: milvus

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
  namespace: milvus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
      - name: milvus
        image: milvusdb/milvus:v2.3.4
        ports:
        - containerPort: 19530
        env:
        - name: ETCD_ENDPOINTS
          value: localhost:2379
        - name: MINIO_ADDRESS
          value: localhost:9000
        volumeMounts:
        - name: milvus-data
          mountPath: /var/lib/milvus
      volumes:
      - name: milvus-data
        persistentVolumeClaim:
          claimName: milvus-data

---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: milvus
spec:
  type: LoadBalancer
  ports:
  - port: 19530
    targetPort: 19530
  selector:
    app: milvus