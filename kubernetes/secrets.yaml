apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
  namespace: recruiter-ai
spec:
  provider:
    gcpsm:
      projectID: recruiter-ai-milvus
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: recruiter-ai-sa
            namespace: recruiter-ai
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resume-embedding-secrets
  namespace: recruiter-ai
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: resume-embedding-app-secrets
    creationPolicy: Owner
  data:
  - secretKey: MILVUS_URI
    remoteRef:
      key: resume-embedding-milvus-uri
  - secretKey: API_KEY
    remoteRef:
      key: resume-embedding-api-key 