apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiter-backend
  namespace: recruiter-ai
  labels:
    app: recruiter-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruiter-backend
  template:
    metadata:
      labels:
        app: recruiter-backend
    spec:
      serviceAccountName: recruiter-ai-sa
      imagePullSecrets:
      - name: gcr-json-key
      containers:
      - name: recruiter-backend
        image: gcr.io/recruiter-ai-milvus/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: MILVUS_URI
          valueFrom:
            secretKeyRef:
              name: resume-embedding-app-secrets
              key: MILVUS_URI
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: resume-embedding-app-secrets
              key: API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recruiter-backend
  namespace: recruiter-ai
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: recruiter-backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recruiter-backend-network-policy
  namespace: recruiter-ai
spec:
  podSelector:
    matchLabels:
      app: recruiter-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: milvus
    ports:
    - protocol: TCP
      port: 19530 